<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sizzle Shift - a tiny diner kitchen</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #14171b; }
  body { display: grid; place-items: center; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; }
  #stage { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; overflow: hidden; border-radius: 12px; background: #1d2126; box-shadow: 0 26px 90px rgba(0, 0, 0, .65); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
</head>
<body>
  <div id="stage"><canvas id="game" width="1280" height="720" aria-label="Sizzle Shift cooking game"></canvas></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
